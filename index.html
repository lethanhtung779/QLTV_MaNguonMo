<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Quản lý Thư viện</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <div class="logo-circle">TV</div>
        <h1>Quản lý Thư viện</h1>
        <p>Hệ thống quản lý thư viện trực tuyến</p>
      </div>

      <form id="loginForm" class="login-form" novalidate>
        <div class="form-group">
          <label for="username">Tên đăng nhập</label>
          <input type="text" id="username" placeholder="Nhập tên đăng nhập" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="Nhập mật khẩu" autocomplete="current-password">
            <button type="button" class="toggle-password" aria-label="Hiện/ẩn mật khẩu">👁</button>
          </div>
        </div>
        <div class="login-options">
          <label class="checkbox-label">
            <input type="checkbox" id="remember"> Ghi nhớ đăng nhập
          </label>
          <a href="#" class="forgot-link">Quên mật khẩu?</a>
        </div>
        <p id="loginError" class="error-message" hidden>Bạn cần nhập đầy đủ tên đăng nhập và mật khẩu!</p>
        <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>
      </form>

      <p class="login-hint">Tài khoản demo: <strong>admin</strong> / <strong>123456</strong></p>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var user = document.getElementById('username').value.trim();
      var pass = document.getElementById('password').value;
      var err = document.getElementById('loginError');

      if (!user || !pass) {
        err.hidden = false;
        return;
      }
      err.hidden = true;

      // Backend sẽ kiểm tra tài khoản thật sau này; bây giờ chỉ demo
      if (user === 'admin' && pass === '123456') {
        window.location.href = 'dashboard.html';
      } else {
        err.textContent = 'Sai tên đăng nhập hoặc mật khẩu!';
        err.hidden = false;
      }
    });

    document.querySelector('.toggle-password').addEventListener('click', function () {
      var input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    });
  </script>
</body>
</html>
